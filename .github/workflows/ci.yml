name: Intégration continue

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Compiler et contrôler le site
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Compiler, valider et préparer la publication
        run: npm run ci

      - name: Conserver l’artefact de production
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
